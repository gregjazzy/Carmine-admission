# La démonstration, elle, est publique : ni no-store ni noindex, c'est une
# page vitrine à part entière.
[[redirects]]
  from = "/demo.html"
  to = "/demo"
  status = 301
  force = true

# Le portail ne doit jamais être mis en cache ni indexé
[[headers]]
  for = "/espace-client"
  [headers.values]
    Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# La démonstration est un outil montré en rendez-vous, pas une page à référencer
[[headers]]
  for = "/demo"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/pilotage"
  [headers.values]
    Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Le blog anglais est un dossier : sans cette règle, /blog/en sans barre
# oblique finale retombe sur la page d'accueil. Le statut 200 sert la page
# sans modifier l'URL affichée.
[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/blog/en"
  to = "/blog/en/index.html"
  status = 200

# L'adresse que l'on devine pour le blog anglais
[[redirects]]
  from = "/en/blog"
  to = "/blog/en/"
  status = 301

