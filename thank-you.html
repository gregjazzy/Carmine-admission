<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Merci | Carmine Admission</title>

  <link rel="preload" href="/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/PlayfairDisplay-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <script type="module" src="/src/js/main.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="header scrolled">
    <div class="header__inner">
      <a href="/" class="header__logo">Carmine <span>Admission</span></a>
      <div class="nav-overlay"></div>
      <nav class="nav">
        <ul class="nav__list">
          <li><a href="/consulting-admissions" class="nav__link" data-i18n="nav.approach">Accompagnement</a></li>
          <li><a href="/ressources" class="nav__link" data-i18n="nav.resources">Ressources</a></li>
          <li><a href="/about" class="nav__link" data-i18n="nav.founder">À propos</a></li>
          <li><a href="/espace-client" class="nav__link" data-i18n="nav.client_area">Espace client</a></li>
        </ul>
        <div class="lang-toggle">
          <button class="lang-toggle__selected" aria-label="Changer de langue">
            <span class="lang-flag">🇫🇷</span>
            <span class="lang-toggle__arrow">▾</span>
          </button>
          <div class="lang-toggle__dropdown">
            <button class="lang-toggle__btn active" data-lang="fr"><span class="lang-flag">🇫🇷</span> Français</button>
            <button class="lang-toggle__btn" data-lang="en"><span class="lang-flag">🇬🇧</span> English</button>
          </div>
        </div>
      </nav>
      <button class="menu-toggle" aria-label="Menu">
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
      </button>
    </div>
  </header>

  <main>
    <section class="section" style="min-height: 80vh; display: flex; align-items: center;">
      <div class="container" style="text-align: center;">
        <div style="font-size: 4rem; margin-bottom: var(--space-lg);">✓</div>
        <h1 class="section__title" data-i18n="thank_you.title" style="margin-bottom: var(--space-md);">Merci !</h1>
        <p style="color: var(--text-secondary); font-size: 1.125rem; margin-bottom: var(--space-xl);" data-i18n="thank_you.text">Votre message a bien été envoyé. Nous vous recontacterons sous 24h.</p>
        <a href="/" class="btn btn--primary btn--lg" data-i18n="thank_you.back">Retour à l'accueil</a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__bottom" style="border-top: none;">
        <p class="footer__copyright" data-i18n="footer.copyright">© 2026 Carmine Admission. Tous droits réservés.</p>
        <p class="footer__legal"><a href="/mentions-legales" class="footer__legal-link" data-i18n="footer.legal">Mentions légales</a> · <a href="/confidentialite" class="footer__legal-link" data-i18n="footer.privacy">Confidentialité</a></p>
      </div>
    </div>
  </footer>

</body>
</html>
